name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go.sum
      
      - name: Install dependencies
        run: |
          cd src
          go mod download
      
      - name: Run linters
        run: |
          cd src
          go fmt ./...
          go vet ./...
      
      - name: Run tests
        run: |
          cd src
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
      
      - name: Check coverage
        run: |
          cd src
          
          # Get total coverage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          
          echo "Total coverage: ${COVERAGE}%"
          
          # Use 45% threshold to account for platform-specific code
          # (spawn_windows.go = 226 lines untestable on Linux runners)
          # (spawn_unix.go = 100 lines untestable on Windows runners)
          THRESHOLD=45
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          else
            echo "✓ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"
          fi
      
      - name: Upload coverage
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: ./src/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
