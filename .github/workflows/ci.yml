name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: src/go.sum
      
      - name: Install dependencies
        run: |
          cd src
          go mod download
      
      - name: Run linters
        run: |
          cd src
          go fmt ./...
          go vet ./...
      
      - name: Run tests
        run: |
          cd src
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
      
      - name: Check coverage
        run: |
          cd src
          
          # Get total coverage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          
          echo "Total coverage: ${COVERAGE}%"
          
          # Use 55% threshold to account for platform-specific code
          # (spawn_windows.go = 226 lines untestable on Linux runners)
          # (spawn_unix.go = 100 lines untestable on Windows runners)
          # Testable code has 91%+ coverage, but overall average is lower
          THRESHOLD=55
          
          # Check coverage against threshold
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          else
            echo "✓ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"
          fi
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./src/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
